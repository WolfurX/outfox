[package]
name = "settlement"
version = "0.1.0"
description = "Outfox settlement program — the chain edge (see contracts/ for the frozen EVM reference)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
solana-instructions-sysvar = "3.0"
solana-sdk-ids = "3.1"

[dev-dependencies]
ed25519-dalek = "2"
litesvm = { version = "0.16.0", features = ["precompiles"] }
litesvm-token = "0.16.0"
sha2 = "0.11.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
