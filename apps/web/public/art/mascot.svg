<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900">
  <!-- Outfox mascot — layered geometric SVG traced from art/mascot.webp.
       Jacket layers read their fill from - -ofx-jacket / - -ofx-jacket-2 (cosmetic
       line hook); every default below renders the canonical charcoal-navy. -->
  <g id="tail">
    <polygon points="228,596 322,570 356,650 334,790 254,844 218,760" fill="#E8730F"/>
    <polygon points="322,570 356,650 312,672 296,596" fill="#FFE3C2"/>
    <polygon points="228,596 264,656 254,844 218,760" fill="#C2570F"/>
  </g>
  <g id="legs">
    <polygon points="150,540 196,540 186,842 148,842" fill="#14181F"/>
    <polygon points="200,540 246,548 232,842 196,842" fill="#1B2029"/>
    <polygon points="196,540 200,540 198,700" fill="#0B0E14"/>
  </g>
  <g id="feet">
    <polygon points="128,842 190,842 196,876 120,876" fill="#7C8598"/>
    <polygon points="192,842 252,842 262,876 188,876" fill="#6E7789"/>
    <polyline points="140,876 144,858 156,876" fill="#5E6678"/>
    <polyline points="208,876 212,858 224,876" fill="#525A6B"/>
  </g>
  <g id="jacket">
    <polygon points="126,314 234,314 246,470 238,584 122,584 112,470" fill="var(--ofx-jacket, #262C3B)"/>
    <polygon points="234,314 246,470 238,584 196,584 208,330" fill="var(--ofx-jacket-2, #1D2230)"/>
    <!-- sleeves, pushed-up cuffs, pocketed hands -->
    <polygon points="128,322 148,332 122,478 96,466" fill="var(--ofx-jacket, #262C3B)"/>
    <polygon points="232,322 212,332 240,478 266,466" fill="var(--ofx-jacket-2, #1D2230)"/>
    <polygon points="96,466 122,478 116,514 90,502" fill="#7C8598"/>
    <polygon points="266,466 240,478 246,514 272,502" fill="#6E7789"/>
    <polygon points="90,502 116,514 132,540 118,556" fill="#5E6678"/>
    <polygon points="272,502 246,514 232,540 246,556" fill="#525A6B"/>
    <!-- lapels -->
    <polygon points="150,316 180,328 152,414 134,392" fill="var(--ofx-jacket-2, #1D2230)"/>
    <polygon points="212,316 182,328 208,414 228,392" fill="var(--ofx-jacket, #262C3B)"/>
  </g>
  <g id="shirt">
    <polygon points="156,318 204,318 208,470 196,560 168,560 152,470" fill="#F4F1EA"/>
    <polygon points="156,318 180,328 164,352" fill="#FFFFFF"/>
    <polygon points="204,318 180,328 196,352" fill="#E7E2D6"/>
  </g>
  <g id="tie">
    <polygon points="172,330 190,330 186,346 174,346" fill="#171B26"/>
    <polygon points="174,346 186,346 192,470 178,492 168,466" fill="#1E2431"/>
  </g>
  <g id="head">
    <!-- neck -->
    <polygon points="168,292 198,292 202,322 164,322" fill="#EFDCC4"/>
    <!-- ears -->
    <polygon points="118,124 142,50 170,122" fill="#E8730F"/>
    <polygon points="142,50 150,32 166,104" fill="#14181F"/>
    <polygon points="132,118 146,74 158,118" fill="#F6E7D4"/>
    <polygon points="244,122 220,46 194,120" fill="#C2570F"/>
    <polygon points="220,46 212,28 198,102" fill="#14181F"/>
    <!-- skull -->
    <polygon points="114,186 180,92 250,182 240,246 182,270 122,244" fill="#E8730F"/>
    <polygon points="180,92 250,182 240,246 182,270" fill="#D96208"/>
    <polygon points="250,182 258,222 236,248 236,204" fill="#C2570F"/>
    <!-- lower face: full cream mass, muzzle points left -->
    <polygon points="114,232 182,252 232,238 214,282 170,300 118,278 94,252" fill="#F6E7D4"/>
    <polygon points="114,232 138,224 144,250 108,262" fill="#FFE3C2"/>
    <polygon points="118,278 170,300 160,312 130,306" fill="#EFDCC4"/>
    <!-- nose -->
    <polygon points="86,242 110,234 114,254 96,260" fill="#14181F"/>
    <!-- smirk: shallow, rises right -->
    <path d="M118 266 Q152 284 192 262" fill="none" stroke="#14181F" stroke-width="5" stroke-linecap="round"/>
    <!-- brows: outer high, inner low -->
    <polygon points="130,158 174,176 172,190 128,172" fill="#14181F"/>
    <polygon points="234,156 194,174 196,188 236,170" fill="#14181F"/>
    <!-- half-lidded eyes: flat heavy lid, sliver of white below -->
    <polygon points="136,186 172,196 170,214 140,206" fill="#FDF6EC"/>
    <polygon points="136,186 172,196 171,204 137,194" fill="#14181F"/>
    <circle cx="157" cy="205" r="6" fill="#171B26"/>
    <polygon points="230,184 198,194 200,212 228,204" fill="#FDF6EC"/>
    <polygon points="230,184 198,194 199,202 229,192" fill="#14181F"/>
    <circle cx="212" cy="202" r="6" fill="#171B26"/>
  </g>
</svg>
